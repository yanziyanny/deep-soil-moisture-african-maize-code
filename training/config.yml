random_seed: 42
test_size: 0.20

data:
  input_file: training/data/figure4_retraining_input.csv.gz
  target_variable: sif_anom
  admin_unit_variable: admin2_idx
  grouping_variable: county_year
  grouping_source_columns:
    - admin2_idx
    - year
  year_stratification_variable: year
  climate_zone_variable: koppen5
  sample_weight_variable:

feature_groups:
  Energy:
    - VPDa_8mean
    - SWa_8mean
    - Tmaxa_8mean
  SurfaceWater:
    - SMa_L1_8mean
    - PPTa_8sum
  RootWater:
    - SMa_L2_8mean
    - SMa_L3_8mean

feature_aliases:
  VPDa_8mean:
    - VPDa_8mean
    - VPDa_8mean
    - VPD_8mean_anom
  SWa_8mean:
    - SWa_8mean
    - SW_8mean_anom
  Tmaxa_8mean:
    - Tmaxa_8mean
    - Tmax_8mean_anom
  SMa_L1_8mean:
    - SMa_L1_8mean
    - SM_L1_8mean_anom
  PPTa_8sum:
    - PPTa_8sum
    - PPTa_8mean
    - PPT_8sum_anom
    - PPT_8mean_anom
  SMa_L2_8mean:
    - SMa_L2_8mean
    - SM_L2_8mean_anom
  SMa_L3_8mean:
    - SMa_L3_8mean
    - SM_L3_8mean_anom

cross_validation:
  method: GroupKFold
  n_splits: 5
  grouping_variable: county_year

early_stopping:
  eval_metric: rmse
  rounds: 150
  n_estimators: 4000
  learning_rate: 0.12
  max_depth: 7
  min_child_weight: 1
  subsample: 0.90
  colsample_bytree: 0.90
  reg_lambda: 0.5
  tree_method: hist
  n_jobs: -1

sample_weight:
  method: energy_soft_threshold
  sw_column: SW_8mean_raw
  sw_threshold: 21.6
  tmax_column: Tmax_8mean_raw
  tmax_threshold: 18.0

bootstrap:
  iters: 1000
  confidence_level: 0.95
  resample_unit: held_out_rows

hard_energy_filter:
  description: "Tmax > 15 C, VPD > 0.5 kPa, SW > 200 W m-2"
  thresholds:
    Tmax_8mean_raw:
      label: Tmax
      operator: ">"
      value: 15
      units: C
      aliases:
        - Tmax_8mean_raw
        - Tmax_raw
    VPD_8mean_raw:
      label: VPD
      operator: ">"
      value: 0.5
      units: kPa
      aliases:
        - VPD_8mean_raw
        - VPD_raw
        - VPD_8mean
      alternate_if_values_look_like_hpa:
        value: 5
        units: hPa
    SW_8mean_raw:
      label: SW
      operator: ">"
      value: 200
      units: W m-2
      aliases:
        - SW_8mean_raw
        - SW_raw
      alternate_if_values_look_like_mj_m2_day:
        value: 17.28
        units: MJ m-2 day-1

shapley:
  sample_size: 0

quick:
  bootstrap_iters: 20
  max_rows_per_zone: 3000
  n_estimators: 60
  early_stopping_rounds: 10
  cv_folds_to_train: 2
  shap_sample_size: 500
